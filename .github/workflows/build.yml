name: Build APK
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Build Android APK
      run: |
        G=$(find . -name gradlew | head -n 1)
        if [ -z "$G" ]; then
          echo "⚠️ gradlew not found in repository. Falling back to global gradle..."
          gradle assembleDebug
        else
          echo "✅ gradlew found at $G. Building with wrapper..."
          chmod +x "$G"
          cd $(dirname "$G")
          ./gradlew assembleDebug
        fi
    - uses: actions/upload-artifact@v4
      with:
        name: AI-Studio-APK
        path: "**/build/outputs/apk/debug/*.apk"
